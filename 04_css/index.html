<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{ 
            color: green;
            font-size: 1.9rem;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
        #perreo{ color: red}
        .chacarron{
            width: 200px;
            height: 200px;
            border: 3px solid red;
            color: yellow;
            background: blue;
            font-size: 1.4rem;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            border-radius: 100%;

        }
        .mio{
            width: 100px;
            height: 100px;
            background: rgb(255,255,0);
            border: 2px solid red;
            padding: 5px;
            margin:5px;
            box-sizing: border-box;
        }
        .tuyo{
            width: 100px;
            height: 100px;
            background: rgb(0,255,0);
        }
        
    </style>
</head>
<body>
    <h1 style="color:red">Este es un Titulo</h1>
    <p>Este es un párrafo 0.</p>
    <p id="perreo">Este es un párrafo 1.</p>
    <p>Este es un párrafo 2.</p>

    <div class="chacarron">C</div>

    <div class="mio">P</div>
    <div class="tuyo">T</div>

</body>
</html>
