<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0px; padding:0px; color: white; text-align: center;}
        .banner{ background-color: #000000;}
        .titulares{ background-color: blue;}
        .editoriales{background-color: red;}

        /* Para laptops y Monitores*/
        .titulares, .editoriales{ display: inline-block; width: 49%;}

        /* Para Móviles y tableta */
        @media only screen and ( max-width: 992px) {
            .titulares, .editoriales { width: 100%}
        }
    </style>
</head>
<body>
    <div class="banner">Banner</div>
    <div>
        <div class="titulares">Titulares</div>
        <div class="editoriales">Editoriales</div>
    </div>
    <div>Footer</div>
</body>
</html>
