<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de Contenido</title>
    <script src="cambio-contenido.js"></script>
    <style>
        section{ margin: 20px; padding: 30px; background: #ddd; width: 300px; display: inline-block;}
        
        .mostrar{ display:block}
        .ocultar{ display: none;}
        .cajaroja{ border: 1px solid red}
    </style>
</head>
<body>
    <h1>Cambio de Contenido</h1>

    <div class="container">
        <section>
            <h1>Contenido interno del elemento</h1>
            <div class="miclase">DIV 1</div>
            <div class="miclase">DIV 2</div>
            <button onclick="cambioContenidoElementoHTML();"> Cambiar contenido texto</button>
        </section>


        <section>
            <h1>Atributos</h1>
            <img src="https://picsum.photos/id/237/200/300" alt="">
            <ul>
                <li onclick="tieneAtributo();">Tiene Atributo SRC</li>
                <li onclick="obtenerAtributo();">Obtener atributo SRC</li>
                <li onclick="removerAtributo();">Remover atributo SRC</li>
                <li onclick="configurarAtributo();">Setear atributo SRC</li>
            </ul>
        </section>

        <section>
            <h1>Clases</h1>
            <div>DIV1</div>
            <div id="div_ejemplo" class="mostrar">DIV2</div>

            <button onclick="mostrar()">Mostrar Elemento</button>
            <button onclick="ocultar()">Ocultar Elemento</button>
            <button onclick="agregarClase()">Agregar clase</button>
            <button onclick="removerClase()">Eliminar clase</button>
        </section>

        <section>
            <h1>Estilos con style</h1>
            <div>DIV NORMAL</div>
            <div>DIF MODIFICADO</div>

            <button>Cambiar color borde</button>
        </section>
    </div>
</body>
</html>
